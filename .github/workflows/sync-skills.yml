name: Sync skills from docs-restate and agentlib

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Checkout docs-restate
        uses: actions/checkout@v4
        with:
          repository: restatedev/docs-restate
          ref: main
          path: .docs-restate
          sparse-checkout: |
            restate-plugin/skills
          sparse-checkout-cone-mode: false

      # Sync the agentlib skill from the latest release, not main, so the skill
      # matches the @restatedev/agentlib version that users install from npm.
      - name: Resolve latest agentlib release
        id: agentlib
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release view --repo restatedev/agentlib --json tagName --jq .tagName)
          if [ -z "$TAG" ]; then
            echo "Could not resolve the latest restatedev/agentlib release" >&2
            exit 1
          fi
          echo "Latest agentlib release: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout agentlib
        uses: actions/checkout@v4
        with:
          repository: restatedev/agentlib
          ref: ${{ steps.agentlib.outputs.tag }}
          path: .agentlib
          sparse-checkout: |
            plugins/restate-agents/skills
          sparse-checkout-cone-mode: false

      - name: Sync plugins/restatedev/skills/
        run: |
          DEST=plugins/restatedev/skills
          rm -rf "$DEST"
          mkdir -p "$DEST"

          if [ -d ".docs-restate/restate-plugin/skills" ]; then
            cp -R .docs-restate/restate-plugin/skills/. "$DEST/"
          else
            echo "Source directory restate-plugin/skills not found in docs-restate@main" >&2
            exit 1
          fi

          AGENTLIB_SRC=.agentlib/plugins/restate-agents/skills
          if [ ! -d "$AGENTLIB_SRC" ]; then
            echo "Source directory plugins/restate-agents/skills not found in agentlib@${{ steps.agentlib.outputs.tag }}" >&2
            exit 1
          fi
          # Fail instead of silently overwriting a docs-restate skill with the same name.
          for SKILL in "$AGENTLIB_SRC"/*/; do
            NAME=$(basename "$SKILL")
            if [ -e "$DEST/$NAME" ]; then
              echo "Skill '$NAME' exists in both docs-restate and agentlib" >&2
              exit 1
            fi
          done
          cp -R "$AGENTLIB_SRC"/. "$DEST/"

          rm -rf .docs-restate .agentlib

      - name: Bump plugin versions if skills changed
        run: |
          SKILLS_DIR=plugins/restatedev/skills
          # git status also reports untracked files, such as a newly added skill.
          if [ -z "$(git status --porcelain -- "$SKILLS_DIR")" ]; then
            echo "$SKILLS_DIR unchanged — skipping version bump."
            exit 0
          fi

          for M in \
            plugins/restatedev/.claude-plugin/plugin.json \
            plugins/restatedev/.codex-plugin/plugin.json \
            plugins/restatedev/.cursor-plugin/plugin.json
          do
            CURRENT=$(jq -r '.version' "$M")
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
            NEXT="${MAJOR}.${MINOR}.$((PATCH + 1))"
            jq --arg v "$NEXT" '.version = $v' "$M" > "$M.tmp"
            mv "$M.tmp" "$M"
            echo "$M: $CURRENT -> $NEXT"
          done

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            plugins/restatedev/skills \
            plugins/restatedev/.claude-plugin/plugin.json \
            plugins/restatedev/.codex-plugin/plugin.json \
            plugins/restatedev/.cursor-plugin/plugin.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          VERSION=$(jq -r '.version' plugins/restatedev/.claude-plugin/plugin.json)
          git commit -m "plugin v${VERSION}: sync skills from restatedev/docs-restate@main and restatedev/agentlib@${{ steps.agentlib.outputs.tag }}"
          git push
